# Copie ce fichier en config.yaml et adapte-le à ton goût.
#
# Les règles sont testées dans l'ordre : la première qui correspond gagne.
# - extensions : le fichier doit avoir une de ces extensions (en minuscules)
# - name       : le nom doit ressembler à un de ces motifs (* = n'importe quoi)
# - to         : dossier de destination ({year} et {month} = date du fichier)

source: ~/Downloads          # dossier à ranger
destination: ~/Downloads     # où créer les dossiers de rangement

fallback: null               # mets "Divers" pour ranger aussi les fichiers sans règle

ignore:                      # fichiers à ne jamais déplacer
  - "*.torrent"

rules:
  - name: Factures et papiers
    match:
      name: ["*facture*", "*invoice*", "*quittance*", "*bulletin*paie*", "*avis*impo*", "*relev*"]
      extensions: [pdf]
    to: Admin/{year}

  - name: Captures d'écran
    match:
      name: ["screenshot*", "capture*"]
      extensions: [png, jpg, jpeg]
    to: Images/Captures/{year}-{month}

  - name: Images
    match: { extensions: [jpg, jpeg, png, gif, webp, heic, bmp, svg, avif] }
    to: Images

  - name: Vidéos
    match: { extensions: [mp4, mkv, mov, avi, webm] }
    to: Vidéos

  - name: Musique
    match: { extensions: [mp3, flac, wav, ogg, m4a] }
    to: Musique

  - name: PDF
    match: { extensions: [pdf] }
    to: Documents/PDF

  - name: Documents
    match: { extensions: [doc, docx, odt, rtf, txt, md, xls, xlsx, ods, csv, ppt, pptx, odp] }
    to: Documents

  - name: Archives
    match: { extensions: [zip, rar, 7z, tar, gz] }
    to: Archives

  - name: Installateurs
    match: { extensions: [exe, msi, msix, iso, apk] }
    to: Installateurs

  - name: Code
    match: { extensions: [py, js, ts, json, yaml, yml, html, css, sql, sh, ps1, ipynb] }
    to: Code

# Envoie à la corbeille les fichiers trop anciens de certains dossiers
cleanup:
  - folder: Installateurs
    older_than_days: 30
