[project]
name = "downloads-organizer"
version = "0.1.0"
description = "Range automatiquement le dossier Téléchargements selon des règles YAML, avec annulation."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
